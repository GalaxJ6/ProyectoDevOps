apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-api-config
  namespace: default
  labels:
    app: todo-api
data:
  DB_PATH: /data/tasks.db
  LOG_LEVEL: INFO
  FLASK_ENV: production
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-api-secrets
  namespace: default
  labels:
    app: todo-api
type: Opaque
stringData:
  # Add your secrets here if needed
  # Example: API_KEY: "your-secret-key"
  # IMPORTANT: Don't commit actual secrets to git!
  # Use external secret management (Sealed Secrets, HashiCorp Vault, AWS Secrets Manager, etc.)
  PLACEHOLDER: "replace-with-your-secret"
