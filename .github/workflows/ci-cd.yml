name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solución a la advertencia: Forzamos el entorno de ejecución a Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          echo "Linting Python code..."
          python -m flake8 src tests --count --statistics --show-source

      - name: Run dependency audit
        continue-on-error: true
        run: |
          echo "Auditing dependencies..."
          python -m pip_audit -r requirements-dev.txt

      - name: Run unit tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --junitxml=reports/junit.xml --tb=short

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/junit.xml
          retention-days: 30

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optimización: Usamos 'load: true' para que Buildx guarde la imagen directamente 
      # en el motor de Docker local usando su potente sistema de caché.
      - name: Build and load Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            todo-api:${{ github.sha }}
            todo-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ya no hace falta compilar de nuevo. Solo creamos la carpeta y exportamos.
      - name: Save Docker image artifact
        run: |
          mkdir -p reports
          docker save todo-api:${{ github.sha }} -o reports/todo-api-${{ github.sha }}.tar

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: reports/todo-api-*.tar
          retention-days: 30